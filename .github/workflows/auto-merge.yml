name: Auto merge to main

# When code is pushed to the default fix branch, open/update a PR and merge it
# so Vercel deploys without manual merge clicks.
on:
  push:
    branches:
      - fix/harden-payments-auth-tooling
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR and merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="Auto: sync ${BRANCH} into main"
          BODY="Automated merge so production (Vercel) updates without a manual merge step."

          # Ensure PR exists
          if ! gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" || true
          fi

          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR found for $BRANCH"
            exit 0
          fi

          # Enable auto-merge (squash) then merge immediately if possible
          gh pr merge "$PR" --squash --delete-branch=false --admin || \
          gh pr merge "$PR" --squash --delete-branch=false || \
          echo "Merge queued or blocked by branch protection; check PR #$PR"
